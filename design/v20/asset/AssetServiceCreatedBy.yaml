AssetServiceCreatedBy:
  type: string
  nullable: true
  enum:
  - ADVERTISER
  - SYSTEM
  - UNKNOWN
  title: AssetServiceCreatedBy
  description: |
    <div lang="ja">AssetServiceCreatedByは、アセットの作成元を表します。<br>
    このフィールドは、GET時は検索条件として使用され、GET以外のリクエストでは無視されます。</div>
    <div lang="en">AssetServiceCreatedBy describes who created the asset.<br>
    This field is used as a search condition in GET operation and will be ignored in requests other than GET.</div>
    <dl class=term>
      <dt class="term__item">ADVERTISER</dt>
      <dd class="term__desc"><span lang="ja">広告主が作成したアセットです。</span><span lang="en">The asset was created by the advertiser.</span></dd>
      <dt class="term__item">SYSTEM</dt>
      <dd class="term__desc"><span lang="ja">システムが自動生成したアセットです。</span><span lang="en">The asset was automatically created by the system.</span></dd>
      <dt class="term__item">UNKNOWN</dt>
      <dd class="term__desc"><span lang="ja">未知の値です。</span><span lang="en">Unknown value.</span></dd>
    </dl>
